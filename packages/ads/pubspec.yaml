name: ads
description: "Reusable Google Mobile Ads (AdMob) wrapper: init, banner/interstitial/rewarded/app-open helpers."
version: 0.0.1
publish_to: 'none'
homepage:

environment:
  sdk: 3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # https://pub.dev/packages/google_mobile_ads
  google_mobile_ads: ^9.0.0
  # https://pub.dev/packages/flutter_riverpod
  flutter_riverpod: ^3.3.2
  # https://pub.dev/packages/riverpod_annotation
  riverpod_annotation: 4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # https://pub.dev/packages/build_runner
  build_runner: ^2.15.0
  # https://pub.dev/packages/riverpod_generator
  riverpod_generator: 4.0.4

flutter:
  uses-material-design: true
